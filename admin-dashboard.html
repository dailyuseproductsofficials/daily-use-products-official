<!DOCTYPE html>
<html lang="bn">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin Panel | Daily Use Products Official</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Bengali:wght@400;500;700;800;900&display=swap" rel="stylesheet" />
    <style>
      :root {
        --bg: #edf3ff;
        --bg-dark: #0a1220;
        --panel: #ffffff;
        --panel-soft: #f5f8ff;
        --muted: #65758f;
        --text: #162235;
        --line: #dfe9f9;
        --primary: #165dff;
        --primary-soft: #eaf2ff;
        --success: #1f9d61;
        --success-soft: #ebfff5;
        --warning: #d68a00;
        --warning-soft: #fff7e7;
        --danger: #d92d20;
        --danger-soft: #fff1f0;
        --shadow: 0 18px 40px rgba(17, 34, 66, 0.12);
      }

      * { box-sizing: border-box; }
      html { scroll-behavior: smooth; }
      body {
        margin: 0;
        font-family: "Noto Sans Bengali", "Segoe UI", sans-serif;
        background: linear-gradient(180deg, #eef4ff 0%, #f7faff 100%);
        color: var(--text);
      }
      a { color: inherit; text-decoration: none; }
      img { max-width: 100%; display: block; }
      button, input, select, textarea { font: inherit; }
      .app { max-width: 1500px; margin: 0 auto; padding: 22px 18px 48px; }
      .topbar {
        display: flex; align-items: center; justify-content: space-between; gap: 16px;
        padding: 18px 22px; color: #fff;
        background: linear-gradient(135deg, #0e1c35 0%, #173765 60%, #1f5ecc 100%);
        border-radius: 26px; box-shadow: 0 30px 60px rgba(10,17,32,0.15); margin-bottom: 24px;
      }
      .brand { display: flex; align-items: center; gap: 14px; }
      .brand-mark {
        width: 52px; height: 52px; border-radius: 16px; display: grid; place-items: center;
        font-size: 24px; background: rgba(255,255,255,0.12); border: 1px solid rgba(255,255,255,0.15);
      }
      .brand h1 { margin: 0; font-size: clamp(22px, 2vw, 32px); line-height: 1.2; }
      .brand p { margin: 4px 0 0; opacity: 0.82; font-size: 13px; }
      .status-row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; justify-content: flex-end; }
      .pill {
        border: 1px solid rgba(255,255,255,0.18); background: rgba(255,255,255,0.08); color: #f0f6ff;
        font-size: 12px; padding: 8px 11px; border-radius: 999px; font-weight: 700;
      }
      .pill.success { background: rgba(31,157,97,0.12); color: #dfffee; }
      .layout {
        display: grid; grid-template-columns: minmax(330px, 1fr) minmax(410px, 1.1fr); gap: 22px;
      }
      .panel {
        background: var(--panel); border: 1px solid var(--line); border-radius: 22px; box-shadow: var(--shadow);
        padding: 18px;
      }
      .panel h2 { margin: 0 0 8px; font-size: 24px; }
      .panel-sub { margin: 0 0 16px; color: var(--muted); font-size: 13px; }
      .field-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
      .field { display: flex; flex-direction: column; gap: 8px; }
      .field.full { grid-column: 1 / -1; }
      label { font-size: 13px; font-weight: 700; }
      input, select, textarea {
        width: 100%; padding: 10px 12px; border: 1px solid var(--line); border-radius: 12px; background: #fff; color: var(--text); outline: none;
      }
      input:focus, select:focus, textarea:focus {
        border-color: rgba(22, 93, 255, 0.8); box-shadow: 0 0 0 4px rgba(22, 93, 255, 0.08);
      }
      textarea { min-height: 110px; resize: vertical; }
      .btn-row { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 18px; }
      button {
        border: 0; border-radius: 12px; padding: 11px 14px; font-weight: 800; cursor: pointer;
        transition: transform 0.15s ease, opacity 0.15s ease;
      }
      button:hover { transform: translateY(-1px); }
      button.primary { background: linear-gradient(135deg, var(--primary), #0a6afe); color: #fff; box-shadow: 0 12px 20px rgba(15,96,245,0.25); }
      button.secondary { background: #edf3ff; border: 1px solid #dfeaff; color: var(--primary); }
      button.warning { background: var(--warning-soft); color: var(--warning); border: 1px solid #f9d98e; }
      button.danger { background: var(--danger-soft); color: var(--danger); border: 1px solid #ffd9d3; }
      button.ghost { background: transparent; border: 1px solid var(--line); color: var(--text); }
      .status-box {
        margin-top: 14px; display: none; border-radius: 12px; padding: 11px 12px; font-size: 13px; font-weight: 700; border: 1px solid transparent;
      }
      .status-box.show { display: block; }
      .status-box.success { color: var(--success); background: var(--success-soft); border-color: #cfeedc; }
      .status-box.error { color: var(--danger); background: var(--danger-soft); border-color: #ffd8d4; }
      .section-list { margin-top: 18px; display: grid; gap: 12px; }
      .item { background: var(--panel-soft); border: 1px solid var(--line); border-radius: 16px; padding: 12px 12px 10px; }
      .item-head { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-bottom: 8px; }
      .item-title { font-weight: 800; font-size: 15px; }
      .item-badge {
        display: inline-flex; align-items: center; padding: 5px 8px; border-radius: 999px; background: rgba(22,93,255,0.08); color: var(--primary);
        font-size: 10px; font-weight: 800; letter-spacing: 0.02em; text-transform: uppercase;
      }
      .item-meta { font-size: 12px; color: var(--muted); }
      .item-actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
      .mini-btn { padding: 7px 10px; border-radius: 10px; border: 1px solid var(--line); background: #fff; cursor: pointer; font-size: 12px; font-weight: 700; }
      .mini-btn.primary { border-color: rgba(22,93,255,0.25); background: rgba(22,93,255,0.06); color: var(--primary); }
      .mini-btn.danger { border-color: rgba(217,45,32,0.22); background: rgba(217,45,32,0.04); color: var(--danger); }
      .preview-wrap { display: flex; flex-direction: column; gap: 14px; }
      .preview-site {
        background: linear-gradient(180deg, #0a1220 0%, #0d1730 100%);
        min-height: 700px; border-radius: 26px; padding: 20px 18px 18px; color: #edf3ff; border: 1px solid rgba(170,189,230,0.12);
      }
      .preview-head { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 18px; }
      .preview-head h3 { margin: 0; font-size: 22px; }
      .preview-badge {
        background: rgba(126,192,255,0.08); color: #d4ecff; border: 1px solid rgba(126,192,255,0.2); padding: 8px 12px; border-radius: 999px; font-size: 11px; font-weight: 800; letter-spacing: 0.08em; text-transform: uppercase;
      }
      .preview-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
      .preview-card {
        background: rgba(17,24,34,0.82); border: 1px solid rgba(150,179,226,0.2); border-radius: 18px; padding: 14px; min-height: 116px;
      }
      .preview-card h4 { margin: 0 0 8px; font-size: 18px; }
      .preview-card p { margin: 0; color: #b9caeb; font-size: 12px; line-height: 1.7; }
      .preview-link {
        display: inline-flex; margin-top: 12px; padding: 8px 10px; border-radius: 10px; background: rgba(126,192,255,0.1); border: 1px solid rgba(126,192,255,0.2);
        color: #bfe4ff; font-size: 11px; font-weight: 800;
      }
      .sheet-actions { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; margin-top: 8px; }
      .section-select { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-bottom: 6px; }
      @media (max-width: 1000px) { .layout { grid-template-columns: 1fr; } }
      @media (max-width: 560px) {
        .field-grid { grid-template-columns: 1fr; }
        .topbar { flex-direction: column; align-items: flex-start; }
        .status-row { justify-content: flex-start; }
        .preview-grid { grid-template-columns: 1fr; }
      }
    </style>
  </head>
  <body>

              <option value="links">দরকারি লিংক</option>

          </div>

          <form id="cardForm">

            <div class="btn-row">

            <div id="statusBox" class="status-box" aria-live="polite"></div>

        <aside class="panel preview-wrap">

          <div class="preview-site">
